services:
  backend:
    build: ./app
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-models/gemini-embedding-001}
      - EMBEDDING_VERSION=${EMBEDDING_VERSION:-20250301}
      - USE_MOCK_GEMINI=${USE_MOCK_GEMINI:-true}
      - MOCK_GEMINI_URL=http://mock_gemini:9000
    volumes:
      - ./app:/app
      - ./results:/results
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    profiles: ["ui"]
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend

  mock_gemini:
    build: ./evaluation
    ports:
      - "9000:9000"
    command: python mock_gemini_server.py

  agent:
    build: ./agent
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-models/gemini-embedding-001}
      - EMBEDDING_VERSION=${EMBEDDING_VERSION:-20250301}
      - BACKEND_URL=http://backend:8000
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
      - USE_MOCK_GEMINI=${USE_MOCK_GEMINI:-true}
      - REFLECTION_USE_MOCK=${REFLECTION_USE_MOCK:-}
      - MOCK_GEMINI_URL=http://mock_gemini:9000
      # ── LLMプロバイダ切替（gemini | bedrock）＆ AWS Bedrock 設定 ──
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-}
      - BEDROCK_MODEL_ID=${BEDROCK_MODEL_ID:-anthropic.claude-3-5-haiku-20241022-v1:0}
      - BEDROCK_EMBED_MODEL_ID=${BEDROCK_EMBED_MODEL_ID:-amazon.titan-embed-text-v2:0}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
    volumes:
      - ./agent:/agent
      - ./app:/app
      - ./evaluation:/evaluation
      - ./results:/results
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - backend
      - mock_gemini
